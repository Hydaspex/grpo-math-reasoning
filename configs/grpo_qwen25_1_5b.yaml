experiment_name: qwen25-1.5b-gsm8k-grpo
seed: 42

model:
  name_or_path: unsloth/Qwen2.5-1.5B-Instruct
  max_seq_length: 1024
  load_in_4bit: true
  fast_inference: true
  gpu_memory_utilization: 0.9
  lora_rank: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset_name: openai/gsm8k
  dataset_config: main
  grpo_path: data/grpo_train.jsonl
  sft_path: data/sft_train.jsonl
  validation_path: data/validation.jsonl
  max_samples: null
  validation_fraction: 0.05

sft:
  output_dir: outputs/qwen25-gsm8k-sft
  epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  max_steps: -1

grpo:
  output_dir: outputs/qwen25-gsm8k-grpo
  learning_rate: 0.000005
  num_generations: 8
  max_prompt_length: 256
  max_completion_length: 200
  max_steps: 250
  beta: 0.0
  temperature: 1.0
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  max_grad_norm: 0.1

reward:
  correctness: 2.0
  integer: 0.5
  strict_format: 0.5
  soft_format: 0.5
  xmlcount: 0.5

mlflow:
  tracking_uri: null
  experiment: /Shared/grpo-math-reasoning
