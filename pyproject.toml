[project]
name = "mathrl"
version = "0.1.0"
description = "GRPO reinforcement learning on GSM8K math reasoning with verifiable rewards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.44; platform_machine != 'arm64'",
  "unsloth>=2025.1",
  "mlflow>=2.17",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathrl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
